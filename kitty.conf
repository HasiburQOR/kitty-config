# ─────────────────────────────────────────────
# FONT CONFIGURATION
# ─────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0

adjust_line_height 2
adjust_column_width 0

disable_ligatures never

# ─────────────────────────────────────────────
# RETRO NEON ORANGE THEME
# ─────────────────────────────────────────────

background #090603
foreground #ffb347

selection_background #3a2412
selection_foreground #ffd6a0

# Cursor
cursor #ff7a00
cursor_text_color #090603
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# URLs
url_color #ff9500
url_style straight

# ── Normal Colors ──
color0  #1a120b
color1  #ff6b00
color2  #ff9f1c
color3  #ffb347
color4  #ff8800
color5  #ffae42
color6  #ffcc80
color7  #ffd6a0

# ── Bright Colors ──
color8  #5c3b1e
color9  #ff7a00
color10 #ffb84d
color11 #ffd280
color12 #ff9500
color13 #ffc266
color14 #ffd699
color15 #fff2e0

# ─────────────────────────────────────────────
# TAB BAR
# ─────────────────────────────────────────────

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top

active_tab_foreground #090603
active_tab_background #ff9500

inactive_tab_foreground #aa7744
inactive_tab_background #1a120b

tab_bar_background #090603

tab_title_template " {index}: {title[:20]} "
active_tab_title_template " ⚡ {index}: {title[:20]} "

# ─────────────────────────────────────────────
# WINDOW & EFFECTS
# ─────────────────────────────────────────────

background_opacity 0.4
dynamic_background_opacity yes

background_blur 8

window_padding_width 12

active_border_color #ff9500
inactive_border_color #2a1a0f

bell_border_color #ffb347

draw_minimal_borders yes
window_border_width 2px

inactive_text_alpha 0.8
dim_opacity 0.5

remember_window_size yes

initial_window_width 1100
initial_window_height 650

# ─────────────────────────────────────────────
# PERFORMANCE
# ─────────────────────────────────────────────

repaint_delay 10
input_delay 3
sync_to_monitor yes

# ─────────────────────────────────────────────
# CLIPBOARD / MOUSE
# ─────────────────────────────────────────────

copy_on_select yes

mouse_hide_wait 2.0

detect_urls yes
open_url_with default

clipboard_control write-clipboard write-primary

# ─────────────────────────────────────────────
# KEYBOARD SHORTCUTS
# ─────────────────────────────────────────────

kitty_mod ctrl+shift

# Copy/Paste
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+w close_tab

map kitty_mod+right next_tab
map kitty_mod+left previous_tab

# New window
map kitty_mod+enter new_window_with_cwd

# Font zoom
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0 change_font_size all 0

# Fullscreen
map kitty_mod+F11 toggle_fullscreen

# Reload config
map kitty_mod+F5 load_config_file

# Unicode input
map kitty_mod+u kitten unicode_input

# URL hints
map kitty_mod+e open_url_with_hints

# Transparency
map kitty_mod+a>m set_background_opacity +0.05
map kitty_mod+a>l set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default

# ─────────────────────────────────────────────
# AUDIO / SHELL
# ─────────────────────────────────────────────

enable_audio_bell no

shell_integration enabled

term xterm-kitty

# ─────────────────────────────────────────────
# REMOTE CONTROL
# ─────────────────────────────────────────────

allow_remote_control yes
listen_on unix:@devhasib

# ─────────────────────────────────────────────
# MISC
# ─────────────────────────────────────────────

confirm_os_window_close 2

update_check_interval 0

allow_hyperlinks yes
