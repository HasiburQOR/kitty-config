# ╔══════════════════════════════════════════════════════════╗
# ║         KITTY TERMINAL - ANIME DARK THEME CONFIG         ║
# ║              by Hasibur × Claude                         ║
# ╚══════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────
# FONT CONFIGURATION
# ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

# Fallback fonts (in case Nerd Font not installed)
# font_family      Fira Code
# font_family      Cascadia Code

font_size        13.0
adjust_line_height   2
adjust_column_width  0

# Nerd Font icons / ligatures
disable_ligatures never


# ─────────────────────────────────────────────
# ANIME DARK COLOR THEME
# Inspired by: Evangelion + Cyberpunk Anime
# ─────────────────────────────────────────────
background            #0d0f1a
foreground            #c8d3f5

# Cursor — glowing sakura pink
cursor                #ff79c6
cursor_text_color     #0d0f1a
cursor_shape          beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6
cursor_stop_blinking_after 10.0

# Selection highlight
selection_background  #2d2f45
selection_foreground  #c8d3f5

# URL underline color
url_color             #89b4fa
url_style             curly

# ── Normal Colors ──
color0   #1a1b2e   # black        (deep space)
color1   #ff5c8a   # red          (sakura red)
color2   #a9dc76   # green        (neon leaf)
color3   #ffd866   # yellow       (golden anime)
color4   #78bfed   # blue         (rei ayanami blue)
color5   #ff79c6   # magenta      (anime pink)
color6   #67e8f9   # cyan         (cyber teal)
color7   #c8d3f5   # white        (soft white)

# ── Bright Colors ──
color8   #2a2d3e   # bright black  (shadow)
color9   #ff7eb3   # bright red    (hot pink)
color10  #c3e88d   # bright green  (bright leaf)
color11  #ffe082   # bright yellow (soft gold)
color12  #89b4fa   # bright blue   (sky blue)
color13  #f5c2e7   # bright magenta (blush pink)
color14  #89dceb   # bright cyan   (ice blue)
color15  #ffffff   # bright white

# ── Tab Bar Colors ──
active_tab_foreground   #0d0f1a
active_tab_background   #ff79c6
inactive_tab_foreground #888eb4
inactive_tab_background #1a1b2e
tab_bar_background      #0d0f1a
tab_bar_edge            top


# ─────────────────────────────────────────────
# WINDOW & TRANSPARENCY
# ─────────────────────────────────────────────
background_opacity          0.90
background_blur             20
dynamic_background_opacity  yes

window_padding_width        12
window_margin_width         0
single_window_margin_width  -1

Window border colors (anime glow effect)
active_border_color   #ffd866
inactive_border_color #1a1b2e
draw_minimal_borders  no
window_border_width   2px

# active_border_color   #ff79c6
# inactive_border_color #2d2f45
bell_border_color     #ffd866

# Window decorations
hide_window_decorations no
remember_window_size    yes
initial_window_width    1100
initial_window_height   650

draw_minimal_borders    yes


# ─────────────────────────────────────────────
# TAB BAR
# ─────────────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title[:20]} "
active_tab_title_template " ⚡ {index}: {title[:20]} "
tab_bar_min_tabs        1
tab_switch_strategy     previous


# ─────────────────────────────────────────────
# SCROLLBACK & PERFORMANCE
# ─────────────────────────────────────────────
scrollback_lines         10000
scrollback_pager         less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no

wheel_scroll_multiplier  5.0
touch_scroll_multiplier  1.0

# Rendering performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes


# ─────────────────────────────────────────────
# COPY / PASTE (FEATURE 1)
# ─────────────────────────────────────────────
copy_on_select           yes          # auto-copy selected text to clipboard
paste_actions            quote-urls-at-prompt,confirm
strip_trailing_spaces    smart

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


# ─────────────────────────────────────────────
# URL DETECTION (FEATURE 2)
# ─────────────────────────────────────────────
detect_urls              yes
open_url_with            default
url_prefixes             file ftp ftps git http https irc ircs kitty mailto news sftp ssh


# ─────────────────────────────────────────────
# MOUSE (FEATURE 3)
# ─────────────────────────────────────────────
mouse_hide_wait          2.0
click_interval           0.5
focus_follows_mouse      yes
pointer_shape_when_grabbed arrow


# ─────────────────────────────────────────────
# AUDIO BELL — OFF (anime terminals are silent)
# ─────────────────────────────────────────────
enable_audio_bell        no
visual_bell_duration     0.2
visual_bell_color        #ff79c6
window_alert_on_bell     yes


# ─────────────────────────────────────────────
# SHELL INTEGRATION (FEATURE 4)
# ─────────────────────────────────────────────
shell_integration        enabled
# Gives: cmd duration, cwd tracking, SSH auto-title, mark prompts


# ─────────────────────────────────────────────
# LAYOUTS (FEATURE 5 — Split Panes)
# ─────────────────────────────────────────────
enabled_layouts tall,fat,horizontal,vertical,stack,grid
# Default layout when opening kitty
# Switch layouts with: ctrl+shift+l


# ─────────────────────────────────────────────
# KEYBOARD SHORTCUTS
# ─────────────────────────────────────────────
kitty_mod ctrl+shift

# ── Copy / Paste ──
map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+s         paste_from_selection
map shift+insert        paste_from_selection

# ── Tabs ──
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+w         close_tab
map kitty_mod+right     next_tab
map kitty_mod+left      previous_tab
map kitty_mod+1         goto_tab 1
map kitty_mod+2         goto_tab 2
map kitty_mod+3         goto_tab 3
map kitty_mod+4         goto_tab 4
map kitty_mod+5         goto_tab 5
map kitty_mod+.         move_tab_forward
map kitty_mod+,         move_tab_backward
map kitty_mod+alt+t     set_tab_title

# ── Split Windows / Panes (FEATURE 5) ──
map kitty_mod+enter     new_window_with_cwd
map kitty_mod+d         launch --location=hsplit --cwd=current
map kitty_mod+shift+d   launch --location=vsplit --cwd=current
map kitty_mod+]         next_window
map kitty_mod+[         previous_window
map kitty_mod+f         move_window_forward
map kitty_mod+b         move_window_backward
map kitty_mod+`         move_window_to_top
map kitty_mod+r         start_resizing_window
map kitty_mod+l         next_layout

# ── Font Size (FEATURE 6 — Dynamic Zoom) ──
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

# ── Scrollback ──
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback
map kitty_mod+g         show_last_command_output   # needs shell_integration

# ── URL Hints (FEATURE 7 — click URLs from keyboard) ──
map kitty_mod+e         open_url_with_hints
map kitty_mod+p>f       kitten hints --type path --program -
map kitty_mod+p>l       kitten hints --type line --program -
map kitty_mod+p>w       kitten hints --type word --program -
map kitty_mod+p>h       kitten hints --type hash --program -

# ── Unicode Input (FEATURE 8 — insert emoji/symbols) ──
map kitty_mod+u         kitten unicode_input

# ── Broadcast to all windows (FEATURE 9 — sync typing) ──
map kitty_mod+alt+b     launch --allow-remote-control kitty +kitten broadcast

# ── Transparency toggle (FEATURE 10) ──
map kitty_mod+a>m       set_background_opacity +0.05
map kitty_mod+a>l       set_background_opacity -0.05
map kitty_mod+a>1       set_background_opacity 1
map kitty_mod+a>d       set_background_opacity default

# ── Screenshot / Screencap ──
map kitty_mod+F10       toggle_maximized
map kitty_mod+F11       toggle_fullscreen

# ── Config reload ──
map kitty_mod+F5        load_config_file
map kitty_mod+F6        debug_config

# ── Close window safely ──
map kitty_mod+q         close_window
map super+q             close_os_window

# Confirm before closing with multiple windows
confirm_os_window_close  2


# ─────────────────────────────────────────────
# MARKS (FEATURE 11 — highlight lines)
# ─────────────────────────────────────────────
mark1_foreground  #0d0f1a
mark1_background  #ff79c6
mark2_foreground  #0d0f1a
mark2_background  #ffd866
mark3_foreground  #0d0f1a
mark3_background  #a9dc76

map kitty_mod+m         toggle_marker iregex 1 (\bERROR\b|\bFAILED\b)
map kitty_mod+shift+m   remove_marker
map kitty_mod+,         scroll_to_mark prev
map kitty_mod+.         scroll_to_mark next


# ─────────────────────────────────────────────
# REMOTE CONTROL (FEATURE 12)
# ─────────────────────────────────────────────
allow_remote_control     yes
listen_on                unix:/tmp/mykitty


# ─────────────────────────────────────────────
# MISC
# ─────────────────────────────────────────────
update_check_interval    0
startup_session          none
term                     xterm-256color
close_on_child_death     no
allow_hyperlinks         yes



# Active vs inactive window background color difference
active_tab_background     #ff79c6
inactive_tab_background   #1a1b2e

# This dims inactive kitty windows
dim_opacity 0.4


